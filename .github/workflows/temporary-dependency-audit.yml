name: Temporary dependency audit
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --json || true
